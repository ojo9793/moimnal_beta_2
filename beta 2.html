    await deleteRoomFromCloud(roomId);
    showToast('모임 방이 삭제되었습니다.');
  }

  /* =========================================================
     📌 후보 · 확정 탭 (시간대 계산 + 3단계 상태 + 상세 사유 바텀시트)
     ========================================================= */
  function computeGoldenIntervalsForDate(room, dateIso) {
    let commonFree = [{ start: 0, end: 1440 }];
    const myEff = getMyEffectiveDayStatus(room, dateIso, false);

    const applyParticipantInfo = (info) => {
      if (!info) return;
      if (info.status === 'X') {
        commonFree = [];
        return;
      }
      if (info.status === '△') {
        let pFree = null;
        if (Array.isArray(info.freeIntervals) && info.freeIntervals.length > 0) {
          pFree = info.freeIntervals;
        } else if (Array.isArray(info.busyIntervals) && info.busyIntervals.length > 0) {
          pFree = subtractIntervalsFromFullDay(info.busyIntervals);
        } else if (info.time) {
          const parsed = parseTimeRangeMinutes(info.time);
          if (parsed) {
            const iv = [{ start: parsed.start, end: Math.min(1440, parsed.end) }];
            pFree = (info.time.includes('불가능') || info.time.includes('불가'))
              ? subtractIntervalsFromFullDay(iv)
              : iv;
          }
        }
        if (pFree) {
          const nextCommon = [];
          commonFree.forEach(cf => {
            pFree.forEach(pf => {
              const s = Math.max(cf.start, pf.start);
              const e = Math.min(cf.end, pf.end);
              if (e > s) nextCommon.push({ start: s, end: e });
            });
          });
          commonFree = mergeMinuteIntervals(nextCommon);
        }
      }
    };

    applyParticipantInfo(myEff);
    room.members.filter(m => m.id !== state.userId).forEach(mem => {
      const memSched = (room.schedulesByUser && room.schedulesByUser[mem.id]) || {};
      applyParticipantInfo(memSched[dateIso]);
    });

    return commonFree;
  }

  function renderRoomCandidatesView(room) {
    const e = state.emojis;
    const showReminderFilter = state.features.reminderFilter;
    const unsubmitted = room.members.filter(m => !m.submitted);

    const dateSet = new Set();
    Object.values(room.schedulesByUser || {}).forEach(uMap => {
      Object.keys(uMap || {}).forEach(d => dateSet.add(d));
    });
    (room.pinnedDates || []).forEach(p => dateSet.add(p.date));

    const candidates = [];
    dateSet.forEach(dateIso => {
      const myEff = getMyEffectiveDayStatus(room, dateIso, false);
      let okList = [];
      let maybeList = [];
      let noList = [];

      if (myEff.status === 'O') okList.push({ name: '나', detail: myEff.publicLabel, reasons: myEff.reasons || [] });
      else if (myEff.status === '△') maybeList.push({ name: '나', detail: myEff.publicLabel, reasons: myEff.reasons || [] });
      else if (myEff.status === 'X') noList.push({ name: '나', detail: myEff.publicLabel, reasons: myEff.reasons || [] });

      room.members.filter(m => m.id !== state.userId).forEach(mem => {
        const memSched = (room.schedulesByUser && room.schedulesByUser[mem.id]) || {};
        const info = memSched[dateIso];
        if (!info) return;
        const reasons = Array.isArray(info.reasons) ? info.reasons : [];
        if (info.status === 'O') okList.push({ name: mem.name, detail: info.time || '가능', reasons });
        else if (info.status === '△') maybeList.push({ name: mem.name, detail: info.time || '시간 조율', reasons });
        else if (info.status === 'X') noList.push({ name: mem.name, detail: info.time || '불가능', reasons });
      });

      if (okList.length + maybeList.length > 0 && noList.length === 0) {
        const dow = new Date(dateIso + 'T00:00:00').getDay();
        const isWeekend = (dow === 0 || dow === 6);
        const isAllOk = (okList.length === room.members.length);
        const goldenIntervals = computeGoldenIntervalsForDate(room, dateIso);
        const hasOverlapTime = goldenIntervals.length > 0;

        candidates.push({
          date: dateIso,
          okList,
          maybeList,
          isWeekend,
          isAllOk,
          hasOverlapTime,
          goldenIntervals,
          score: okList.length * 10 + maybeList.length * 5 + (hasOverlapTime ? 3 : -10)
        });
      }
    });

    candidates.sort((a, b) => b.score - a.score || a.date.localeCompare(b.date));

    const activeFilter = showReminderFilter ? state.candidateFilter : 'all';
    const filtered = candidates.filter(c => {
      if (activeFilter === 'all_ok') return c.isAllOk;
      if (activeFilter === 'weekend') return c.isWeekend;
      return true;
    });

    const pinnedMap = {};
    (room.pinnedDates || []).forEach(p => { pinnedMap[p.date] = p; });
    const polls = room.polls || [];

    return `
      ${showReminderFilter ? `
        <div class="card">
          <div class="card-header" style="margin-bottom:6px;">
            <div class="card-title" style="font-size:0.88rem;">🔔 일정 입력 현황 (${room.members.length - unsubmitted.length}/${room.members.length}명 완료)</div>
            <button class="btn btn-ghost btn-xs" onclick="openReminderEditModal('${room.id}')">✏️ 문구</button>
          </div>
          <div class="small muted mb-8">
            ${unsubmitted.length > 0
              ? `미입력 멤버: <b>${unsubmitted.map(m => escapeHtml(m.name)).join(', ')}</b>`
              : '참여한 모든 멤버가 일정 입력을 마쳤습니다! 🎉'}
          </div>
          <button class="btn btn-soft btn-sm" style="width:100%;" onclick="copyReminderMessage('${room.id}')">
            🔔 입력 요청 독촉 문구 복사
          </button>
        </div>

        <div class="btn-row mb-10">
          <button class="btn btn-xs ${state.candidateFilter === 'all' ? 'btn-primary' : 'btn-ghost'}" onclick="setCandidateFilter('all')">전체 (${candidates.length})</button>
          <button class="btn btn-xs ${state.candidateFilter === 'all_ok' ? 'btn-primary' : 'btn-ghost'}" onclick="setCandidateFilter('all_ok')">전원 가능만</button>
          <button class="btn btn-xs ${state.candidateFilter === 'weekend' ? 'btn-primary' : 'btn-ghost'}" onclick="setCandidateFilter('weekend')">주말(토·일)만</button>
        </div>
      ` : ''}

      ${filtered.length === 0 ? `
        <div class="card" style="text-align:center;padding:22px 12px;">
          <div class="muted small">조건에 맞는 후보 날짜가 아직 없습니다.<br>달력 보기에서 [✏️ 내 일정 수정하기]로 일정을 입력해 보세요!</div>
        </div>
      ` : filtered.map(c => {
        const pin = pinnedMap[c.date];
        const statusBadge = c.isAllOk
          ? '<span class="badge badge-ok">전원 가능</span>'
          : (c.hasOverlapTime
            ? '<span class="badge badge-maybe">시간 조율</span>'
            : '<span class="badge">조율 어려움</span>');

        const goldenSummary = c.goldenIntervals.length > 0
          ? (c.goldenIntervals.length === 1 && c.goldenIntervals[0].start === 0 && c.goldenIntervals[0].end === 1440
            ? '종일 전원 가능'
            : `시간대: ${formatIntervalsText(c.goldenIntervals)}`)
          : '겹치는 공통 가능 시간 없음';

        return `
          <div class="card clickable-card" style="${pin ? 'border:1.5px solid var(--accent);' : ''}" onclick="openCandidateDetailSheet('${room.id}', '${c.date}')">
            <div class="card-header">
              <div class="card-title">
                <span>${formatKoreanDate(c.date)}</span>
                ${statusBadge}
              </div>
              <button class="btn btn-xs ${pin ? 'btn-primary' : 'btn-outline'}" onclick="event.stopPropagation();togglePinCandidate('${room.id}', '${c.date}')">
                ${e.sch_pin} ${pin ? '고정 해제' : '핀 고정'}
              </button>
            </div>

            <div class="xs fw-700 mb-6" style="color:${c.hasOverlapTime ? 'var(--ok)' : 'var(--text-sub)'};">
              ✨ ${goldenSummary} <span class="muted" style="font-weight:500;">(눌러서 상세 보기)</span>
            </div>

            ${c.okList.length > 0 ? `
              <div class="small mb-4">
                <span class="badge badge-ok">O (${c.okList.length})</span>
                ${c.okList.map(x => `${escapeHtml(x.name)}(${escapeHtml(x.detail)})`).join(', ')}
              </div>
            ` : ''}

            ${c.maybeList.length > 0 ? `
              <div class="small mb-4">
                <span class="badge badge-maybe">△ (${c.maybeList.length})</span>
                ${c.maybeList.map(x => `${escapeHtml(x.name)}(${escapeHtml(x.detail)})`).join(', ')}
              </div>
            ` : ''}

            ${pin ? `
              <div style="background:var(--surface-2);border-radius:11px;padding:9px 10px;margin-top:8px;" onclick="event.stopPropagation()">
                <div class="xs fw-700" style="color:var(--accent);margin-bottom:4px;">${e.sch_pin} 확정 일정 메모 (홈 화면 연동)</div>
                <div class="xs mb-4">${e.sch_time} <b>시간:</b> ${escapeHtml(pin.time || '미정')}</div>
                <div class="xs mb-4">
                  ${e.sch_place} <b>장소:</b> ${escapeHtml(pin.place || '미정')}
                  ${pin.place && pin.place !== '장소 미정' ? `<button class="btn btn-soft btn-xs" style="margin-left:4px;padding:2px 6px;min-height:20px;" onclick="openMapSearchModal('${escapeHtml(pin.place)}')">🗺️ 지도</button>` : ''}
                </div>
                <div class="xs mb-6">${e.sch_memo} <b>목적·메모:</b> ${escapeHtml(pin.memo || '없음')}</div>
                <button class="btn btn-outline btn-xs" onclick="openPinMemoModal('${room.id}', '${c.date}')">✏️ 시간·장소·메모 수정</button>
              </div>
            ` : ''}
          </div>
        `;
      }).join('')}

      <div class="card">
        <div class="card-header">
          <div class="card-title">🗳️ 장소 · 메뉴 간편 투표 (${polls.length})</div>
          <div class="btn-row">
            <button class="btn btn-ghost btn-xs" onclick="openDutchPayModal('${room.id}')">💸 1/N 정산</button>
            <button class="btn btn-primary btn-xs" onclick="openAddPollModal('${room.id}')">+ 항목</button>
          </div>
        </div>
        ${polls.length === 0 ? `
          <div class="xs muted">장소나 메뉴 후보를 등록해 함께 투표해 보세요.</div>
        ` : polls.map(pl => {
          const voters = Array.isArray(pl.voterIds) ? pl.voterIds : [];
          const votedByMe = voters.includes(state.userId);
          return `
            <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 9px;border-radius:10px;background:var(--surface-2);margin-bottom:6px;">
              <div class="small fw-700" style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">
                ${escapeHtml(pl.title)}
              </div>
              <button class="btn btn-xs ${votedByMe ? 'btn-primary' : 'btn-outline'}" style="flex-shrink:0;" onclick="toggleRoomPollVote('${room.id}', '${pl.id}')">
                👍 ${voters.length}표
              </button>
            </div>
          `;
        }).join('')}
      </div>
    `;
  }

  /* 후보 카드 탭 시 전원 가능 시간대 타임바 + 공개 일정 상세 사유 바텀시트 */
  function openCandidateDetailSheet(roomId, dateIso) {
    const room = state.rooms.find(r => r.id === roomId);
    if (!room) return;
    const golden = computeGoldenIntervalsForDate(room, dateIso);
    const goldenText = golden.length > 0
      ? (golden.length === 1 && golden[0].start === 0 && golden[0].end === 1440
        ? '00:00 ~ 24:00 (종일 전원 가능)'
        : formatIntervalsText(golden))
      : '겹치는 공통 가능 시간대가 없습니다.';

    const barSegsHtml = golden.map(iv => {
      const leftPct = (iv.start / 1440) * 100;
      const widthPct = ((iv.end - iv.start) / 1440) * 100;
      return `<div class="golden-seg" style="left:${leftPct.toFixed(2)}%;width:${widthPct.toFixed(2)}%;"></div>`;
    }).join('');

    const myEff = getMyEffectiveDayStatus(room, dateIso, false);
    const participantRows = [];

    if (myEff.status) {
      participantRows.push({
        name: '나',
        status: myEff.status,
        detail: myEff.publicLabel,
        reasons: myEff.reasons || []
      });
    }

    room.members.filter(m => m.id !== state.userId).forEach(mem => {
      const memSched = (room.schedulesByUser && room.schedulesByUser[mem.id]) || {};
      const info = memSched[dateIso];
      if (!info) return;
      participantRows.push({
        name: mem.name,
        status: info.status,
        detail: info.time || (info.status === 'O' ? '가능' : info.status === 'X' ? '불가능' : '시간 조율'),
        reasons: Array.isArray(info.reasons) ? info.reasons : []
      });
    });

    openModal(`
      <div class="card-header">
        <div class="card-title">✨ ${formatKoreanDate(dateIso)} 시간 조율 상세</div>
        <button class="btn btn-ghost btn-xs" onclick="closeModal()">닫기</button>
      </div>

      <div class="golden-bar-wrap">
        <div class="xs fw-700" style="color:var(--ok);">🟢 참여자 전원 가능 시간대</div>
        <div class="small fw-700 mt-6">${escapeHtml(goldenText)}</div>
        <div class="golden-track">${barSegsHtml}</div>
        <div class="golden-ticks">
          <span>00:00</span><span>06:00</span><span>12:00</span><span>18:00</span><span>24:00</span>
        </div>
      </div>

      <div class="section-label"><span>참여자별 시간 및 공개 일정 사유</span></div>
      ${participantRows.map(p => {
        const badgeCls = p.status === 'O' ? 'badge-ok' : p.status === '△' ? 'badge-maybe' : 'badge-no';
        const reasonsHtml = p.reasons.length > 0
          ? p.reasons.map(r => `
              <div class="xs muted mt-6" style="padding-left:8px;border-left:2px solid var(--accent);">
                📌 <b>${escapeHtml(r.title)}</b> (${escapeHtml(r.time)})${r.note ? ` · ${escapeHtml(r.note)}` : ''}
              </div>
            `).join('')
          : (p.status === '△' ? `<div class="xs muted mt-6">🔒 비공개 일정이거나 사유가 입력되지 않았습니다.</div>` : '');

        return `
          <div class="card" style="padding:10px 11px;margin-bottom:8px;">
            <div style="display:flex;align-items:center;justify-content:space-between;gap:6px;">
              <span class="small fw-700">${escapeHtml(p.name)}</span>
              <span class="badge ${badgeCls}">${p.status} · ${escapeHtml(p.detail)}</span>
            </div>
            ${reasonsHtml}
          </div>
        `;
      }).join('')}
    `);
  }

  function setCandidateFilter(f) {
    state.candidateFilter = f;
    saveLocalUserState();
    renderAll();
  }

  async function togglePinCandidate(roomId, dateIso) {
    const room = state.rooms.find(r => r.id === roomId);
    if (!room) return;
    const idx = (room.pinnedDates || []).findIndex(p => p.date === dateIso);
    if (idx >= 0) {
      room.pinnedDates.splice(idx, 1);
      renderAll();
      await saveRoomToCloud(room);
      showToast('핀 고정이 해제되었습니다.');
    } else {
      const golden = computeGoldenIntervalsForDate(room, dateIso);
      const defaultTime = golden.length > 0 && !(golden.length === 1 && golden[0].start === 0 && golden[0].end === 1440)
        ? `${minutesToHHMM(golden[0].start)} ~ ${minutesToHHMM(golden[0].end)}`
        : '18:00 ~ 20:00';

      room.pinnedDates.push({
        date: dateIso,
        time: defaultTime,
        place: '장소 미정',
        memo: '모임 목적을 입력해 주세요'
      });
      renderAll();
      await saveRoomToCloud(room);
      showToast(`${state.emojis.sch_pin} 약속이 확정되어 홈 화면에 고정되었습니다!`);
    }
  }

  async function toggleRoomPollVote(roomId, pollId) {
    const room = state.rooms.find(r => r.id === roomId);
    const pl = room && (room.polls || []).find(x => x.id === pollId);
    if (!pl) return;
    if (!Array.isArray(pl.voterIds)) pl.voterIds = [];
    const idx = pl.voterIds.indexOf(state.userId);
    if (idx >= 0) {
      pl.voterIds.splice(idx, 1);
    } else {
      pl.voterIds.push(state.userId);
    }
    pl.votes = pl.voterIds.length;
    renderAll();
    await saveRoomToCloud(room);
  }

  function openAddPollModal(roomId) {
    openModal(`
      <div class="card-header">
        <div class="card-title">🗳️ 새 투표 항목 추가</div>
        <button class="btn btn-ghost btn-xs" onclick="closeModal()">닫기</button>
      </div>
      <input class="input mb-10" id="newPollTitleInput" placeholder="예: 강남역 카페, 보드게임카페, 치맥" />
      <button class="btn btn-primary" style="width:100%;" onclick="confirmAddPoll('${roomId}')">투표 항목 등록</button>
    `, true);
  }

  async function confirmAddPoll(roomId) {
    const room = state.rooms.find(r => r.id === roomId);
    const title = (document.getElementById('newPollTitleInput').value || '').trim();
    if (!room || !title) return;
    if (!room.polls) room.polls = [];
    room.polls.push({ id: 'poll_' + Date.now(), title, votes: 1, voterIds: [state.userId] });
    closeModal();
    renderAll();
    await saveRoomToCloud(room);
    showToast('투표 항목이 추가되었습니다!');
  }

  function openDutchPayModal(roomId) {
    const room = state.rooms.find(r => r.id === roomId);
    const defaultCnt = room ? room.members.length : 4;
    openModal(`
      <div class="card-header">
        <div class="card-title">💸 모임 회비 1/N 정산 계산기</div>
        <button class="btn btn-ghost btn-xs" onclick="closeModal()">닫기</button>
      </div>
      <div class="btn-grid-2 mb-8">
        <div>
          <div class="xs fw-700 mb-4">총 결제 금액 (원)</div>
          <input class="input" type="number" id="dutchTotalInput" value="60000" oninput="calcDutchPayPreview()" />
        </div>
        <div>
          <div class="xs fw-700 mb-4">나눌 인원 (명)</div>
          <input class="input" type="number" id="dutchCountInput" value="${defaultCnt}" min="1" oninput="calcDutchPayPreview()" />
        </div>
      </div>
      <div id="dutchResultBox" style="background:var(--accent-soft);border-radius:11px;padding:10px;text-align:center;font-weight:700;color:var(--accent);margin-bottom:10px;"></div>
      <button class="btn btn-primary" style="width:100%;" onclick="copyDutchPayResult('${escapeHtml(room ? room.name : '모임')}')">📋 정산 안내 문구 복사</button>
    `, true);
    calcDutchPayPreview();
  }

  function calcDutchPayPreview() {
    const total = parseInt(document.getElementById('dutchTotalInput').value, 10) || 0;
    const cnt = Math.max(1, parseInt(document.getElementById('dutchCountInput').value, 10) || 1);
    const per = Math.ceil(total / cnt);
    const box = document.getElementById('dutchResultBox');
    if (box) box.textContent = `1인당 ${per.toLocaleString()}원 (총 ${total.toLocaleString()}원 ÷ ${cnt}명)`;
  }

  function copyDutchPayResult(roomName) {
    const total = parseInt(document.getElementById('dutchTotalInput').value, 10) || 0;
    const cnt = Math.max(1, parseInt(document.getElementById('dutchCountInput').value, 10) || 1);
    const per = Math.ceil(total / cnt);
    const msg = `[${roomName} 회비 정산 안내]\n💰 총 금액: ${total.toLocaleString()}원\n👥 인원: ${cnt}명\n👉 1인당 입금액: ${per.toLocaleString()}원`;
    copyText(msg, '💸 1/N 정산 안내가 클립보드에 복사되었습니다!');
    closeModal();
  }

  /* =========================================================
     4. 내 프로필 탭 (일주일 7열 시간표 & 고정 일정 달력)
     ========================================================= */
  function renderProfileTab() {
    const prof = getActiveProfile();
    const e = state.emojis;
    const showMulti = state.features.multiProfile;
    const showTags = state.features.tags;

    const profileSwitcherHtml = state.profiles.map(p => `
      <button class="btn btn-sm ${p.id === prof.id ? 'btn-primary' : 'btn-ghost'}" onclick="selectActiveProfile('${p.id}')">
        ${p.emoji} ${escapeHtml(p.name)}${showTags && p.tag ? ` (#${escapeHtml(p.tag)})` : ''}
      </button>
    `).join('');

    return `
      ${showMulti ? `
        <div class="card">
          <div class="card-header">
            <div class="card-title">${e.nav_profile} 내 멀티 프로필 관리</div>
            <button class="btn btn-soft btn-xs" onclick="openAddProfileModal()">+ 새 프로필</button>
          </div>
          <div class="btn-row mb-10">${profileSwitcherHtml}</div>

          <div style="background:var(--surface-2);border-radius:12px;padding:10px 11px;">
            <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;">
              <div>
                <div class="fw-700">
                  ${prof.emoji} ${escapeHtml(prof.name)}
                  ${showTags && prof.tag ? `<span class="badge">#${escapeHtml(prof.tag)}</span>` : ''}
                </div>
                <div class="xs muted mt-6">기본 PIN: ${prof.pin || '미설정'} · ${currentAuthUser ? '구글 계정 실시간 동기화' : '내 기기 로컬 저장'}</div>
              </div>
              <button class="btn btn-outline btn-xs" onclick="openEditProfileModal('${prof.id}')">✏️ 수정</button>
            </div>

            <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:11px;padding-top:10px;border-top:1px dashed var(--border);">
              <div>
                <div class="small fw-700">🛡️ 전체 일정명 비공개 (마스터 잠금)</div>
                <div class="xs muted">켜면 개별 공개 여부와 관계없이 모든 일정 제목을 숨기고 시간만 표시합니다.</div>
              </div>
              <label class="switch">
                <input type="checkbox" ${prof.privacyMode ? 'checked' : ''} onchange="toggleProfilePrivacy('${prof.id}', this.checked)">
                <span class="slider"></span>
              </label>
            </div>
          </div>
        </div>
      ` : ''}

      <div class="seg-tabs">
        <button class="seg-tab ${state.profileSubTab === 'timeline' ? 'active' : ''}" onclick="setProfileSubTab('timeline')">
          🕒 일주일 시간표 (${(state.weeklySchedules || []).length})
        </button>
        <button class="seg-tab ${state.profileSubTab === 'fixed' ? 'active' : ''}" onclick="setProfileSubTab('fixed')">
          🗓️ 고정 일정 달력 (${(state.fixedEvents || []).length})
        </button>
      </div>

      ${state.profileSubTab === 'timeline'
        ? renderProfileWeekTimetable()
        : renderProfileFixedCalendar()}
    `;
  }

  function selectActiveProfile(profileId) {
    state.activeProfileId = profileId;
    saveLocalUserState();
    renderAll();
    const p = getActiveProfile();
    showToast(`${p.emoji} ${p.name} 프로필로 전환되었습니다.`);
  }

  function toggleProfilePrivacy(profileId, checked) {
    const p = state.profiles.find(x => x.id === profileId);
    if (!p) return;
    p.privacyMode = checked;
    saveLocalUserState();
    renderAll();
    showToast(checked ? '🛡️ 전체 일정명 비공개가 켜졌습니다.' : '👀 개별 일정 비공개 설정이 적용됩니다.');
  }

  function setProfileSubTab(tab) {
    state.profileSubTab = tab;
    saveLocalUserState();
    renderAll();
  }

  function toggleScheduleEnabled(checked) {
    state.scheduleEnabled = checked;
    saveLocalUserState();
    renderAll();
    showToast(checked ? '🕒 주간 시간표 자동 반영이 켜졌습니다.' : '🏖️ 주간 시간표 자동 반영이 일시 해제되었습니다.');
  }

  function toggleExpiredSchedulesAccordion() {
    state.expiredSchedulesOpen = !state.expiredSchedulesOpen;
    saveLocalUserState();
    renderAll();
  }

  function renderProfileWeekTimetable() {
    const isFull24 = !!state.features.fullDayTimeline;
    const startHour = isFull24 ? 0 : 8;
    const endHour = 24;
    const totalHours = endHour - startHour;
    const rangeStartMin = startHour * 60;
    const rangeEndMin = endHour * 60;
    const totalRangeMin = rangeEndMin - rangeStartMin;
    const rowHeightPx = 28;
    const canvasHeightPx = totalHours * rowHeightPx;
    const todayDow = getTodayInfo().dow;
    const dowOrder = getWeekDowOrder();

    const hours = [];
    for (let h = startHour; h < endHour; h++) {
      hours.push(`${String(h).padStart(2, '0')}:00`);
    }

    const activeWeekly = (state.weeklySchedules || []).filter(it => !isWeeklyScheduleExpired(it));
    const expiredWeekly = (state.weeklySchedules || []).filter(it => isWeeklyScheduleExpired(it));

    return `
      <div class="card">
        <div class="card-header">
          <div class="card-title">🕒 일주일 시간표 (${isFull24 ? '00:00~24:00' : '08:00~24:00'})</div>
          <div style="display:flex;align-items:center;gap:6px;">
            <span class="xs fw-700">${state.scheduleEnabled ? '반영 ON' : '해제 OFF'}</span>
            <label class="switch">
              <input type="checkbox" ${state.scheduleEnabled ? 'checked' : ''} onchange="toggleScheduleEnabled(this.checked)">
              <span class="slider"></span>
            </label>
            <button class="btn btn-primary btn-xs" onclick="openScheduleFormModal(null)">+ 일정 추가</button>
          </div>
        </div>

        <div class="week-timetable-shell" style="opacity:${state.scheduleEnabled ? 1 : 0.55};">
          <div class="wt-header-row">
            <div class="wt-corner-cell">시간</div>
            <div class="wt-days-header">
              ${dowOrder.map(d => `
                <div class="wt-day-th ${d === 0 ? 'sun' : d === 6 ? 'sat' : ''} ${d === todayDow ? 'today-col' : ''}">
                  ${DOW_LABELS[d]}
                </div>
              `).join('')}
            </div>
          </div>

          <div class="wt-scroll-body">
            <div class="wt-grid-canvas" style="height:${canvasHeightPx}px;">
              <div class="wt-time-axis">
                ${hours.map(hr => `<div class="wt-hour-tick">${hr.slice(0, 2)}</div>`).join('')}
              </div>

              <div class="wt-columns-wrap">
                ${dowOrder.map(d => {
                  const dayBlocks = getEffectiveWeeklyBlocksForDow(d);
                  const blocksHtml = dayBlocks.map(blk => {
                    const visStart = Math.max(rangeStartMin, blk.startMin);
                    const visEnd = Math.min(rangeEndMin, blk.endMin);
                    if (visEnd <= visStart) return '';

                    const topPct = ((visStart - rangeStartMin) / totalRangeMin) * 100;
                    const heightPct = Math.max(4.5, ((visEnd - visStart) / totalRangeMin) * 100);
                    const tInfo = getScheduleTypeInfo(blk.typeId);
                    const blockColor = normalizeHex(blk.color) || tInfo.color;
                    const contrastText = getContrastTextColor(blockColor);

                    return `
                      <div class="wt-event-card"
                        style="top:${topPct.toFixed(2)}%;height:${heightPct.toFixed(2)}%;background:${blockColor};color:${contrastText};"
                        onclick="openScheduleBlockDetailModal('${blk.id}')">
                        <div>${blk.isPrivate ? '🔒 ' : ''}${escapeHtml(blk.title)}</div>
                        <div class="wt-event-sub">${blk.displayStart}~${blk.displayEnd}</div>
                      </div>
                    `;
                  }).join('');

                  return `
                    <div class="wt-day-col ${d === todayDow ? 'today-col' : ''}">
                      ${hours.map(() => `<div class="wt-cell-line"></div>`).join('')}
                      ${blocksHtml}
                    </div>
                  `;
                }).join('')}
              </div>
            </div>
          </div>
        </div>

        <div class="btn-row mt-8" style="justify-content:space-between;">
          <span class="xs muted">블록을 터치하면 수정 · 복제 · 삭제할 수 있습니다.</span>
          ${!isFull24 ? `<span class="xs muted">새벽 시간은 기능 설정에서 24h 켜기</span>` : ''}
        </div>
      </div>

      <div class="section-label"><span>진행 중인 주간 일정 · 루틴 (${activeWeekly.length})</span></div>
      ${activeWeekly.length === 0 ? `
        <div class="card small muted" style="text-align:center;">등록된 주간 일정이 없습니다. 상단 [+ 일정 추가]로 등록해 보세요.</div>
      ` : activeWeekly.map(item => {
        const tInfo = getScheduleTypeInfo(item.typeId);
        const blockColor = normalizeHex(item.color) || tInfo.color;
        const isOvernight = timeToMinutes(item.end) <= timeToMinutes(item.start);
        const dowsText = (item.dows || []).map(d => DOW_LABELS[d]).join('·');
        const periodText = (item.startDate || item.endDate)
          ? ` · 기한: ${item.startDate || '제한없음'} ~ ${item.endDate || '제한없음'}`
          : '';
        return `
          <div class="timeline-item" style="border-left-color:${blockColor};">
            <div style="min-width:0;flex:1;cursor:pointer;" onclick="openScheduleBlockDetailModal('${item.id}')">
              <div class="fw-700 small">
                ${tInfo.icon} ${escapeHtml(item.title)}
                <span class="badge" style="background:${hexToRgba(blockColor, 0.16)};color:${blockColor};">${escapeHtml(tInfo.name)}</span>
                ${item.isPrivate ? '<span class="badge badge-accent">🔒 비공개</span>' : ''}
              </div>
              <div class="xs muted mt-6">
                매주 <b>${dowsText}</b> · ${item.start} ~ ${isOvernight ? `익일 ${item.end}` : item.end}${periodText}
              </div>
            </div>
            <div class="btn-row" style="gap:4px;flex-shrink:0;">
              <button class="btn btn-ghost btn-xs" onclick="openScheduleFormModal('${item.id}')">수정</button>
              <button class="btn btn-danger btn-xs" onclick="deleteWeeklySchedule('${item.id}')">삭제</button>
            </div>
          </div>
        `;
      }).join('')}

      ${expiredWeekly.length > 0 ? `
        <div class="acc-item mt-10">
          <button class="acc-head" onclick="toggleExpiredSchedulesAccordion()">
            <span>🗂️ 만료된 일정 보기 (${expiredWeekly.length}개)</span>
            <span class="xs muted">${state.expiredSchedulesOpen ? '접기 ▲' : '펼치기 ▼'}</span>
          </button>
          ${state.expiredSchedulesOpen ? `
            <div class="acc-body" style="background:var(--bg);padding-top:10px;">
              <div class="xs muted mb-8">반복 종료 기한이 지나 시간표와 자동 반영에서 제외된 일정입니다. 수정하거나 복제해 다시 사용할 수 있습니다.</div>
              ${expiredWeekly.map(item => {
                const tInfo = getScheduleTypeInfo(item.typeId);
                return `
                  <div class="timeline-item" style="opacity:0.78;">
                    <div style="min-width:0;flex:1;">
                      <div class="fw-700 small">${tInfo.icon} ${escapeHtml(item.title)}</div>
                      <div class="xs muted mt-6">종료일: ${item.endDate} · ${item.start}~${item.end}</div>
                    </div>
                    <div class="btn-row" style="gap:4px;">
                      <button class="btn btn-soft btn-xs" onclick="duplicateWeeklySchedule('${item.id}')">복제</button>
                      <button class="btn btn-ghost btn-xs" onclick="openScheduleFormModal('${item.id}')">수정</button>
                      <button class="btn btn-danger btn-xs" onclick="deleteWeeklySchedule('${item.id}')">삭제</button>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          ` : ''}
        </div>
      ` : ''}
    `;
  }

  function openScheduleBlockDetailModal(schedId) {
    const item = (state.weeklySchedules || []).find(x => x.id === schedId);
    if (!item) return;
    const tInfo = getScheduleTypeInfo(item.typeId);
    const blockColor = normalizeHex(item.color) || tInfo.color;
    const isOvernight = timeToMinutes(item.end) <= timeToMinutes(item.start);
    const dowsText = (item.dows || []).map(d => `${DOW_LABELS[d]}요일`).join(', ');
    const periodText = (item.startDate || item.endDate)
      ? `${item.startDate || '시작일 제한 없음'} ~ ${item.endDate || '종료일 제한 없음'}`
      : '기한 제한 없음 (매주 반복)';

    openModal(`
      <div class="card-header">
        <div class="card-title">${tInfo.icon} ${escapeHtml(item.title)}</div>
        <button class="btn btn-ghost btn-xs" onclick="closeModal()">닫기</button>
      </div>
      <div style="background:var(--surface-2);border-radius:12px;padding:11px;margin-bottom:12px;">
        <div class="small mb-6"><b>성격:</b> <span class="badge" style="background:${hexToRgba(blockColor, 0.18)};color:${blockColor};">${escapeHtml(tInfo.name)}</span></div>
        <div class="small mb-6"><b>반복 요일:</b> ${dowsText}</div>
        <div class="small mb-6"><b>시간:</b> ${item.start} ~ ${isOvernight ? `다음 날 ${item.end} (익일 종료)` : item.end}</div>
        <div class="small mb-6"><b>반복 기한:</b> ${periodText}</div>
        <div class="small mb-6"><b>공개 범위:</b> ${item.isPrivate ? '🔒 일정명 비공개 (시간만 공유)' : '👀 상세 일정명 공개'}</div>
        ${item.note ? `<div class="small"><b>메모:</b> ${escapeHtml(item.note)}</div>` : ''}
      </div>
      <div class="btn-grid-3">
        <button class="btn btn-primary btn-sm" onclick="closeModal();openScheduleFormModal('${item.id}')">✏️ 수정</button>
        <button class="btn btn-soft btn-sm" onclick="closeModal();duplicateWeeklySchedule('${item.id}')">📋 일정 복제</button>
        <button class="btn btn-danger btn-sm" onclick="deleteWeeklySchedule('${item.id}');closeModal();">🗑️ 삭제</button>
      </div>
    `, true);
  }

  function deleteWeeklySchedule(id) {
    state.weeklySchedules = (state.weeklySchedules || []).filter(x => x.id !== id);
    saveLocalUserState();
    renderAll();
    showToast('주간 일정이 삭제되었습니다.');
  }

  /* =========================================================
     1~4번: 주간 일정 추가 / 수정 / 복제 모달 (커스텀 시간 입력 + 빈 값 초기화 + 추천/커스텀 색상)
     ========================================================= */
  let schedFormState = {
    editId: null,
    isDuplicate: false,
    typeId: 'lecture',
    dows: [],
    title: '',
    startHour: '',
    startMin: '',
    endHour: '',
    endMin: '',
    color: '',
    startDate: '',
    endDate: '',
    isPrivate: false,
    note: ''
  };

  function openScheduleFormModal(editId = null) {
    const theme = getCurrentEffectiveTheme();
    if (editId) {
      const target = (state.weeklySchedules || []).find(x => x.id === editId);
      if (!target) return;
      const [sh, sm] = (target.start || ':').split(':');
      const [eh, em] = (target.end || ':').split(':');
      const tInfo = getScheduleTypeInfo(target.typeId);
      schedFormState = {
        editId: target.id,
        isDuplicate: false,
        typeId: target.typeId || 'lecture',
        dows: [...(target.dows || [])],
        title: target.title || '',
        startHour: sh || '',
        startMin: sm || '',
        endHour: eh || '',
        endMin: em || '',
        color: normalizeHex(target.color) || tInfo.color || theme.accent,
        startDate: target.startDate || '',
        endDate: target.endDate || '',
        isPrivate: !!target.isPrivate,
        note: target.note || ''
      };
    } else {
      /* 1번: 새 일정 추가 시 요일 및 시작·종료 시간 모두 빈 상태로 초기화 */
      schedFormState = {
        editId: null,
        isDuplicate: false,
        typeId: 'lecture',
        dows: [],
        title: '',
        startHour: '',
        startMin: '',
        endHour: '',
        endMin: '',
        color: theme.accent,
        startDate: '',
        endDate: '',
        isPrivate: false,
        note: ''
      };
    }
    renderScheduleFormModal();
  }

  function duplicateWeeklySchedule(sourceId) {
    const target = (state.weeklySchedules || []).find(x => x.id === sourceId);
    if (!target) return;
    const [sh, sm] = (target.start || ':').split(':');
    const [eh, em] = (target.end || ':').split(':');
    const tInfo = getScheduleTypeInfo(target.typeId);
    schedFormState = {
      editId: null,
      isDuplicate: true,
      typeId: target.typeId || 'lecture',
      dows: [],
      title: target.title || '',
      startHour: sh || '',
      startMin: sm || '',
      endHour: eh || '',
      endMin: em || '',
      color: normalizeHex(target.color) || tInfo.color,
      startDate: target.startDate || '',
      endDate: target.endDate || '',
      isPrivate: !!target.isPrivate,
      note: target.note || ''
    };
    renderScheduleFormModal();
    showToast('📋 기존 일정 정보가 복사되었습니다. 요일과 시간을 선택해 주세요!');
  }

  function captureScheduleFormInputs() {
    const tEl = document.getElementById('schedTitleInput');
    const shEl = document.getElementById('schedStartHour');
    const smEl = document.getElementById('schedStartMin');
    const ehEl = document.getElementById('schedEndHour');
    const emEl = document.getElementById('schedEndMin');
    const sdEl = document.getElementById('schedStartDateInput');
    const edEl = document.getElementById('schedEndDateInput');
    const prEl = document.getElementById('schedPrivateInput');
    const ntEl = document.getElementById('schedNoteInput');

    if (tEl) schedFormState.title = tEl.value;
    if (shEl) schedFormState.startHour = shEl.value;
    if (smEl) schedFormState.startMin = smEl.value;
    if (ehEl) schedFormState.endHour = ehEl.value;
    if (emEl) schedFormState.endMin = emEl.value;
    if (sdEl) schedFormState.startDate = sdEl.value;
    if (edEl) schedFormState.endDate = edEl.value;
    if (prEl) schedFormState.isPrivate = prEl.checked;
    if (ntEl) schedFormState.note = ntEl.value;
  }

  function renderCustomTimeSelectorHtml(prefix, hourVal, minVal) {
    const hourOpts = Array.from({ length: 24 }, (_, i) => {
      const v = String(i).padStart(2, '0');
      return `<option value="${v}" ${hourVal === v ? 'selected' : ''}>${v}시</option>`;
    }).join('');

    const minOpts = Array.from({ length: 12 }, (_, i) => {
      const v = String(i * 5).padStart(2, '0');
      return `<option value="${v}" ${minVal === v ? 'selected' : ''}>${v}분</option>`;
    }).join('');

    return `
      <div class="custom-time-box">
        <div class="custom-time-row">
          <div class="time-unit-wrap">
            <input type="text" inputmode="numeric" maxlength="2" class="time-num-input" id="${prefix}Hour"
              value="${escapeHtml(hourVal)}" placeholder="시"
              oninput="onCustomTimeNumInput('${prefix}Hour', 23)" />
            <select class="time-drop-select" aria-label="시 선택"
              onchange="onCustomTimeDropSelect('${prefix}Hour', this.value)">
              <option value="">▼</option>
              ${hourOpts}
            </select>
          </div>
          <span class="fw-700 muted">:</span>
          <div class="time-unit-wrap">
            <input type="text" inputmode="numeric" maxlength="2" class="time-num-input" id="${prefix}Min"
              value="${escapeHtml(minVal)}" placeholder="분"
              oninput="onCustomTimeNumInput('${prefix}Min', 59)" />
            <select class="time-drop-select" aria-label="분 선택"
              onchange="onCustomTimeDropSelect('${prefix}Min', this.value)">
              <option value="">▼</option>
              ${minOpts}
            </select>
          </div>
        </div>
      </div>
    `;
  }

  function onCustomTimeNumInput(inputId, maxVal) {
    const el = document.getElementById(inputId);
    if (!el) return;
    let digits = el.value.replace(/\D/g, '').slice(0, 2);
    if (digits !== '' && parseInt(digits, 10) > maxVal) {
      digits = String(maxVal).padStart(2, '0');
    }
    el.value = digits;
    updateOvernightHint();
  }

  function onCustomTimeDropSelect(inputId, val) {
    const el = document.getElementById(inputId);
    if (!el || !val) return;
    el.value = val;
    updateOvernightHint();
  }

  function getFormStartEndStrings() {
    const shRaw = (document.getElementById('schedStartHour')?.value || '').trim();
    const smRaw = (document.getElementById('schedStartMin')?.value || '').trim();
    const ehRaw = (document.getElementById('schedEndHour')?.value || '').trim();
    const emRaw = (document.getElementById('schedEndMin')?.value || '').trim();

    if (shRaw === '' && smRaw === '' && ehRaw === '' && emRaw === '') {
      return { start: '', end: '', incomplete: true };
    }
    if (shRaw === '' || ehRaw === '') {
      return { start: '', end: '', incomplete: true };
    }
    const sh = shRaw.padStart(2, '0');
    const sm = (smRaw === '' ? '00' : smRaw).padStart(2, '0');
    const eh = ehRaw.padStart(2, '0');
    const em = (emRaw === '' ? '00' : emRaw).padStart(2, '0');
    return { start: `${sh}:${sm}`, end: `${eh}:${em}`, incomplete: false };
  }

  function renderScheduleFormModal() {
    const allTypes = getAllScheduleTypes();
    const paletteColors = getRecommendedScheduleColors();
    const dowOrder = getWeekDowOrder();
    const isEdit = !!schedFormState.editId;

    openModal(`
      <div class="card-header">
        <div class="card-title">${isEdit ? '✏️ 주간 일정 수정' : (schedFormState.isDuplicate ? '📋 주간 일정 복제 등록' : '➕ 주간 일정 · 루틴 추가')}</div>
        <button class="btn btn-ghost btn-xs" onclick="closeModal()">닫기</button>
      </div>

      <div class="mb-8">
        <div class="xs fw-700 mb-4">일정 성격 선택</div>
        <div class="emoji-chips">
          ${allTypes.map(tp => `
            <button type="button"
              class="emoji-chip ${schedFormState.typeId === tp.id ? 'active' : ''}"
              style="font-size:0.77rem;padding:5px 9px;font-weight:700;"
              onclick="selectScheduleModalType('${tp.id}')">
              ${tp.icon} ${escapeHtml(tp.name)}
            </button>
          `).join('')}
          <button type="button"
            class="emoji-chip"
            style="font-size:0.77rem;padding:5px 9px;font-weight:700;border-style:dashed;"
            onclick="openCustomScheduleTypePrompt()">
            + 성격 추가
          </button>
        </div>
      </div>

      <div class="mb-8">
        <div class="xs fw-700 mb-4">일정 이름</div>
        <input class="input" id="schedTitleInput" value="${escapeHtml(schedFormState.title)}" placeholder="예: 전공 수업, 아르바이트, 정기 스터디" />
      </div>

      <div class="mb-8">
        <div class="xs fw-700 mb-4">요일 선택 (복수 선택 가능 · 미선택 시 안내)</div>
        <div class="dow-select-grid">
          ${dowOrder.map(d => `
            <button type="button"
              class="dow-toggle-btn ${d === 0 ? 'sun' : d === 6 ? 'sat' : ''} ${schedFormState.dows.includes(d) ? 'active' : ''}"
              onclick="toggleScheduleModalDow(${d})">
              ${DOW_LABELS[d]}
            </button>
          `).join('')}
        </div>
      </div>

      <div class="btn-grid-2 mb-6">
        <div>
          <div class="xs fw-700 mb-4">시작 시간 (드롭다운 / 숫자 입력)</div>
          ${renderCustomTimeSelectorHtml('schedStart', schedFormState.startHour, schedFormState.startMin)}
        </div>
        <div>
          <div class="xs fw-700 mb-4">종료 시간 (드롭다운 / 숫자 입력)</div>
          ${renderCustomTimeSelectorHtml('schedEnd', schedFormState.endHour, schedFormState.endMin)}
        </div>
      </div>
      <div id="overnightHintBox" class="mb-8"></div>

      <div class="mb-8">
        <div class="xs fw-700 mb-4">시간표 블록 색상 (현재 테마 추천 + 직접 추가)</div>
        <div class="color-palette-grid">
          ${paletteColors.map(hex => {
            const isSel = normalizeHex(schedFormState.color) === hex;
            const contrast = getContrastTextColor(hex);
            return `
              <button type="button"
                class="color-circle-btn ${isSel ? 'active' : ''}"
                style="background:${hex};color:${contrast};"
                onclick="selectScheduleColor('${hex}')"
                title="${hex}">
                ${isSel ? '✓' : ''}
              </button>
            `;
          }).join('')}
          <label class="color-add-btn" title="나만의 색상 직접 추가">
            +
            <input type="color" style="opacity:0;width:0;height:0;position:absolute;"
              value="${normalizeHex(schedFormState.color) || '#2563EB'}"
              onchange="addCustomScheduleColor(this.value)" />
          </label>
        </div>
      </div>

      <div class="mb-8">
        <div class="xs fw-700 mb-4">반복 기한 설정 (선택 · 미입력 시 매주 계속 반복)</div>
        <div class="btn-grid-2">
          <div>
            <div class="xs muted mb-4">시작 날짜</div>
            <input class="input" type="date" id="schedStartDateInput" value="${escapeHtml(schedFormState.startDate)}" />
          </div>
          <div>
            <div class="xs muted mb-4">종료 날짜</div>
            <input class="input" type="date" id="schedEndDateInput" value="${escapeHtml(schedFormState.endDate)}" />
          </div>
        </div>
      </div>

      <div style="display:flex;align-items:center;justify-content:space-between;background:var(--surface-2);border-radius:10px;padding:8px 10px;margin-bottom:8px;">
        <div>
          <div class="xs fw-700">🔒 이 일정명 비공개</div>
          <div class="xs muted">켜면 후보 카드 및 상세 사유에서 일정 제목을 숨깁니다.</div>
        </div>
        <label class="switch">
          <input type="checkbox" id="schedPrivateInput" ${schedFormState.isPrivate ? 'checked' : ''}>
          <span class="slider"></span>
        </label>
      </div>

      <div class="mb-10">
        <div class="xs fw-700 mb-4">메모 (선택)</div>
        <input class="input" id="schedNoteInput" value="${escapeHtml(schedFormState.note)}" placeholder="예: 수업 종료 후 바로 이동 가능" />
      </div>

      <button class="btn btn-primary" style="width:100%;" onclick="confirmSaveScheduleForm()">
        ${isEdit ? '수정 내용 저장하기' : '시간표에 등록하기'}
      </button>
    `);
    updateOvernightHint();
  }

  function toggleScheduleModalDow(dow) {
    captureScheduleFormInputs();
    if (schedFormState.dows.includes(dow)) {
      schedFormState.dows = schedFormState.dows.filter(x => x !== dow);
    } else {
      schedFormState.dows.push(dow);
    }
    renderScheduleFormModal();
  }

  function selectScheduleModalType(typeId) {
    captureScheduleFormInputs();
    schedFormState.typeId = typeId;
    const tInfo = getScheduleTypeInfo(typeId);
    if (tInfo && tInfo.color) schedFormState.color = tInfo.color;
    renderScheduleFormModal();
  }

  function selectScheduleColor(hex) {
    captureScheduleFormInputs();
    schedFormState.color = hex;
    renderScheduleFormModal();
  }

  function addCustomScheduleColor(hex) {
    captureScheduleFormInputs();
    const norm = normalizeHex(hex);
    if (!norm) return;
    if (!Array.isArray(state.customScheduleColors)) state.customScheduleColors = [];
    if (!state.customScheduleColors.includes(norm)) {
      state.customScheduleColors.push(norm);
    }
    schedFormState.color = norm;
    saveLocalUserState();
    renderScheduleFormModal();
    showToast(`🎨 커스텀 색상(${norm})이 팔레트에 추가되었습니다!`);
  }

  function openCustomScheduleTypePrompt() {
    captureScheduleFormInputs();
    openModal(`
      <div class="card-header">
        <div class="card-title">✨ 새 일정 성격 추가</div>
        <button class="btn btn-ghost btn-xs" onclick="renderScheduleFormModal()">뒤로</button>
      </div>
      <div class="mb-8">
        <div class="xs fw-700 mb-4">성격 이름</div>
        <input class="input" id="newCustomTypeName" placeholder="예: 운동, 과외, 동아리" />
      </div>
      <div class="mb-10">
        <div class="xs fw-700 mb-4">대표 이모지</div>
        <input class="input" id="newCustomTypeIcon" value="📌" maxlength="4" style="text-align:center;" />
      </div>
      <button class="btn btn-primary" style="width:100%;" onclick="confirmCreateCustomScheduleType()">성격 추가하고 돌아가기</button>
    `, true);
  }

  function confirmCreateCustomScheduleType() {
    const name = (document.getElementById('newCustomTypeName')?.value || '').trim();
    if (!name) {
      showToast('성격 이름을 입력해 주세요!');
      return;
    }
    const icon = (document.getElementById('newCustomTypeIcon')?.value || '').trim() || '📌';
    const palette = ['#7C3AED', '#DB2777', '#059669', '#EA580C', '#0284C7'];
    const color = palette[(state.customScheduleTypes || []).length % palette.length];
    const id = 'ctype_' + Date.now();
    if (!state.customScheduleTypes) state.customScheduleTypes = [];
    state.customScheduleTypes.push({ id, name, icon, color });
    schedFormState.typeId = id;
    schedFormState.color = color;
    saveLocalUserState();
    renderScheduleFormModal();
    showToast(`'${name}' 성격이 추가되었습니다.`);
  }

  function updateOvernightHint() {
    const box = document.getElementById('overnightHintBox');
    if (!box) return;
    const { start, end, incomplete } = getFormStartEndStrings();
    if (incomplete) {
      box.innerHTML = '';
      return;
    }
    const sMin = timeToMinutes(start);
    const eMin = timeToMinutes(end);
    if (sMin !== null && eMin !== null && eMin < sMin) {
      box.innerHTML = `
        <div style="background:var(--accent-soft);border:1px solid var(--accent);border-radius:9px;padding:6px 9px;font-size:0.74rem;color:var(--accent);font-weight:600;">
          🌙 종료 시간이 시작 시간 이전이므로 <b>다음 날(${end}) 종료</b>로 인식되어 익일 새벽 칸까지 분할 표시됩니다.
        </div>
      `;
    } else {
      box.innerHTML = '';
    }
  }

  function confirmSaveScheduleForm() {
    captureScheduleFormInputs();
    const title = (schedFormState.title || '').trim();
    if (!title) {
      showToast('⚠️ 일정 이름을 입력해 주세요!');
      return;
    }
    if (!schedFormState.dows || schedFormState.dows.length === 0) {
      showToast('⚠️ 요일을 최소 1개 이상 선택해 주세요!');
      return;
    }
    const { start, end, incomplete } = getFormStartEndStrings();
    if (incomplete) {
      showToast('⚠️ 시작 시간과 종료 시간을 모두 입력해 주세요!');
      return;
    }
    const sMin = timeToMinutes(start);
    const eMin = timeToMinutes(end);
    if (sMin === eMin) {
      showToast('⚠️ 시작 시간과 종료 시간이 같습니다. 다른 시간을 선택해 주세요!');
      return;
    }
    if (schedFormState.startDate && schedFormState.endDate && schedFormState.endDate < schedFormState.startDate) {
      showToast('⚠️ 반복 종료 날짜가 시작 날짜보다 빠를 수 없습니다!');
      return;
    }

    const dowOrder = getWeekDowOrder();
    const orderedDows = dowOrder.filter(d => schedFormState.dows.includes(d));
    const payload = {
      id: schedFormState.editId || ('ws_' + Date.now()),
      dows: orderedDows,
      start,
      end,
      title,
      typeId: schedFormState.typeId,
      color: normalizeHex(schedFormState.color) || getScheduleTypeInfo(schedFormState.typeId).color,
      startDate: schedFormState.startDate || '',
      endDate: schedFormState.endDate || '',
      isPrivate: !!schedFormState.isPrivate,
      note: (schedFormState.note || '').trim()
    };

    if (schedFormState.editId) {
      const idx = (state.weeklySchedules || []).findIndex(x => x.id === schedFormState.editId);
      if (idx >= 0) state.weeklySchedules[idx] = payload;
    } else {
      state.weeklySchedules.push(payload);
    }

    state.scheduleEnabled = true;
    saveLocalUserState();
    closeModal();
    renderAll();
    showToast(schedFormState.editId ? `✅ '${title}' 일정이 수정되었습니다!` : `🕒 '${title}' 일정이 등록되었습니다!`);
  }

  /* =========================================================
     5번: 고정 일정 달력 (3가지 상태 구분 + 개별 비공개)
     ========================================================= */
  function renderProfileFixedCalendar() {
    const today = getTodayInfo();
    const y = state.profileCalYear;
    const m = state.profileCalMonth;
    const isCurrentMonth = (y === today.year && m === today.month);
    const rawFirstDow = new Date(y, m - 1, 1).getDay();
    const leadingBlanks = getLeadingEmptyCellsCount(rawFirstDow);
    const daysInMonth = new Date(y, m, 0).getDate();
    const pad = n => String(n).padStart(2, '0');
    const dowOrder = getWeekDowOrder();

    const eventsByDate = {};
    (state.fixedEvents || []).forEach(fe => {
      if (!eventsByDate[fe.date]) eventsByDate[fe.date] = [];
      eventsByDate[fe.date].push(fe);
    });

    let cellsHtml = dowOrder.map(d =>
      `<div class="cal-dow ${d === 0 ? 'sun' : d === 6 ? 'sat' : ''}">${DOW_LABELS[d]}</div>`
    ).join('');

    for (let i = 0; i < leadingBlanks; i++) cellsHtml += `<div class="cal-cell empty"></div>`;

    for (let day = 1; day <= daysInMonth; day++) {
      const iso = `${y}-${pad(m)}-${pad(day)}`;
      const evs = eventsByDate[iso] || [];
      const primary = evs[0];
      const cellClass = primary ? (primary.status === 'X' ? 'cell-no' : 'cell-maybe') : '';
      const dispMark = primary ? (primary.status === 'X' ? 'X' : '△') : '';

      cellsHtml += `
        <div class="cal-cell ${cellClass} ${iso === today.iso ? 'today' : ''}" onclick="openFixedEventModal('${iso}')">
          <span class="cal-day-num">${day}</span>
          ${primary
            ? `<span class="cal-status-pill" style="color:${primary.status === 'X' ? 'var(--no)' : 'var(--maybe)'};">${dispMark}</span>`
            : `<span class="xs muted">+</span>`}
          <div class="cal-dots">
            ${evs.length > 0 ? `<span class="cal-dot" style="background:var(--accent);"></span>` : ''}
          </div>
        </div>
      `;
    }

    const monthPrefix = `${y}-${pad(m)}`;
    const monthEvents = (state.fixedEvents || [])
      .filter(fe => fe.date.startsWith(monthPrefix))
      .sort((a, b) => a.date.localeCompare(b.date));

    return `
      <div class="card">
        <div class="cal-nav">
          <div class="cal-month-group">
            <button class="btn btn-ghost btn-sm" onclick="moveProfileCalMonth(-1)">◀</button>
            <span class="cal-month-title">${y}년 ${m}월</span>
            <button class="btn btn-ghost btn-sm" onclick="moveProfileCalMonth(1)">▶</button>
            ${!isCurrentMonth ? `<button class="btn btn-soft btn-xs" onclick="resetProfileCalToToday()">↺ 이번 달</button>` : ''}
          </div>
          <button class="btn btn-primary btn-xs" onclick="openFixedEventModal('${today.iso}')">+ 고정 일정</button>
        </div>
        <div class="xs muted mb-8">날짜별로 <b>종일 불가(X)</b>, <b>특정 시간 불가(△)</b>, <b>특정 시간만 가능(△)</b>을 구분해 등록하세요.</div>

        <div class="cal-grid">${cellsHtml}</div>
      </div>

      <div class="section-label"><span>${y}년 ${m}월 등록된 고정 일정 (${monthEvents.length})</span></div>
      ${monthEvents.length === 0 ? `
        <div class="card small muted" style="text-align:center;">이번 달에 등록된 고정 일정이 없습니다.</div>
      ` : monthEvents.map(fe => {
        const statusLabel = fe.status === 'X'
          ? 'X (종일 불가)'
          : (fe.status === '△_avail'
            ? `△ (${fe.start && fe.end ? `${fe.start}~${fe.end} ` : ''}만 가능)`
            : `△ (${fe.start && fe.end ? `${fe.start}~${fe.end} ` : ''}불가능)`);
        return `
          <div class="card" style="padding:10px 12px;">
            <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;">
              <div>
                <div class="small fw-700">
                  ${formatKoreanDate(fe.date)} · ${escapeHtml(fe.title)}
                  <span class="badge ${fe.status === 'X' ? 'badge-no' : 'badge-maybe'}">${statusLabel}</span>
                  ${fe.isPrivate ? '<span class="badge badge-accent">🔒 비공개</span>' : ''}
                </div>
                ${fe.note ? `<div class="xs muted mt-6">메모: ${escapeHtml(fe.note)}</div>` : ''}
              </div>
              <button class="btn btn-danger btn-xs" onclick="deleteFixedEvent('${fe.id}')">삭제</button>
            </div>
          </div>
        `;
      }).join('')}
    `;
  }

  function moveProfileCalMonth(delta) {
    let m = state.profileCalMonth + delta;
    let y = state.profileCalYear;
    if (m < 1) { m = 12; y--; }
    if (m > 12) { m = 1; y++; }
    state.profileCalMonth = m;
    state.profileCalYear = y;
    saveLocalUserState();
    renderAll();
  }

  function resetProfileCalToToday() {
    const t = getTodayInfo();
    state.profileCalYear = t.year;
    state.profileCalMonth = t.month;
    saveLocalUserState();
    renderAll();
    showToast('이번 달 달력으로 돌아왔습니다!');
  }

  function deleteFixedEvent(id) {
    state.fixedEvents = (state.fixedEvents || []).filter(fe => fe.id !== id);
    saveLocalUserState();
    renderAll();
    showToast('고정 일정이 삭제되었습니다.');
  }

  function openFixedEventModal(defaultDate) {
    openModal(`
      <div class="card-header">
        <div class="card-title">🗓️ 고정 일정 추가</div>
        <button class="btn btn-ghost btn-xs" onclick="closeModal()">닫기</button>
      </div>
      <div class="mb-8">
        <div class="xs fw-700 mb-4">날짜 선택</div>
        <input class="input" type="date" id="feDate" value="${defaultDate}" />
      </div>
      <div class="mb-8">
        <div class="xs fw-700 mb-4">일정 제목</div>
        <input class="input" id="feTitle" placeholder="예: 가족 모임, 자격증 응시, 아르바이트" />
      </div>
      <div class="mb-8">
        <div class="xs fw-700 mb-4">상태 구분 (3가지)</div>
        <select class="select" id="feStatus" onchange="toggleFixedEventTimeBox(this.value)">
          <option value="X">X (종일 불가)</option>
          <option value="△_busy">△ (특정 시간 불가)</option>
          <option value="△_avail">△ (특정 시간만 가능)</option>
        </select>
      </div>

      <div id="feTimeRangeWrap" style="display:none;" class="mb-8">
        <div class="btn-grid-2">
          <div>
            <div class="xs fw-700 mb-4">시작 시간</div>
            ${renderCustomTimeSelectorHtml('feStart', '', '')}
          </div>
          <div>
            <div class="xs fw-700 mb-4">종료 시간</div>
            ${renderCustomTimeSelectorHtml('feEnd', '', '')}
          </div>
        </div>
      </div>

      <div style="display:flex;align-items:center;justify-content:space-between;background:var(--surface-2);border-radius:10px;padding:8px 10px;margin-bottom:8px;">
        <div>
          <div class="xs fw-700">🔒 이 일정명 비공개</div>
          <div class="xs muted">켜면 후보 카드 및 상세 사유에서 일정 제목을 숨깁니다.</div>
        </div>
        <label class="switch">
          <input type="checkbox" id="fePrivateInput">
          <span class="slider"></span>
        </label>
      </div>

      <div class="mb-10">
        <div class="xs fw-700 mb-4">메모 (선택)</div>
        <input class="input" id="feNote" placeholder="예: 시험 종료 후 역 근처 이동 가능" />
      </div>
      <button class="btn btn-primary" style="width:100%;" onclick="confirmAddFixedEvent()">고정 일정 등록</button>
    `);
  }

  function toggleFixedEventTimeBox(statusVal) {
    const wrap = document.getElementById('feTimeRangeWrap');
    if (wrap) wrap.style.display = statusVal === 'X' ? 'none' : 'block';
  }

  function confirmAddFixedEvent() {
    const date = document.getElementById('feDate').value;
    const title = (document.getElementById('feTitle').value || '').trim();
    const status = document.getElementById('feStatus').value;
    const isPrivate = !!document.getElementById('fePrivateInput')?.checked;
    const note = (document.getElementById('feNote').value || '').trim();

    if (!date || !title) {
      showToast('⚠️ 날짜와 일정 제목을 입력해 주세요!');
      return;
    }

    let start = '';
    let end = '';
    if (status !== 'X') {
      const shRaw = (document.getElementById('feStartHour')?.value || '').trim();
      const smRaw = (document.getElementById('feStartMin')?.value || '').trim();
      const ehRaw = (document.getElementById('feEndHour')?.value || '').trim();
      const emRaw = (document.getElementById('feEndMin')?.value || '').trim();
      if (shRaw === '' || ehRaw === '') {
        showToast('⚠️ 시작 시간과 종료 시간을 입력해 주세요!');
        return;
      }
      start = `${shRaw.padStart(2, '0')}:${(smRaw || '00').padStart(2, '0')}`;
      end = `${ehRaw.padStart(2, '0')}:${(emRaw || '00').padStart(2, '0')}`;
      if (start === end) {
        showToast('⚠️ 시작 시간과 종료 시간이 같습니다.');
        return;
      }
    }

    state.fixedEvents.push({
      id: 'fe_' + Date.now(),
      date,
      title,
      status,
      start,
      end,
      isPrivate,
      note
    });
    saveLocalUserState();
    closeModal();
    renderAll();
    showToast('고정 일정이 등록되었습니다!');
  }

  /* =========================================================
     5. 꾸미기 · 설정 탭 (구글 계정 연동 카드 + 달력 시작 요일 + 기존 메뉴)
     ========================================================= */
  function setSettingsSubPage(sub) {
    state.settingsSubPage = sub;
    if (sub === 'guide') state.openGuideAccordions = {};
    saveLocalUserState();
    renderAll();
    const scroll = document.getElementById('appScroll');
    if (scroll) scroll.scrollTop = 0;
  }

  function setWeekStartDay(dayMode) {
    state.weekStartDay = dayMode;
    saveLocalUserState();
    renderAll();
    showToast(dayMode === 'mon' ? '📅 달력과 시간표가 [월요일 시작]으로 변경되었습니다.' : '📅 달력과 시간표가 [일요일 시작]으로 변경되었습니다.');
  }

  function toggleFeatureFlag(key, checked) {
    state.features[key] = checked;
    saveLocalUserState();
    renderAll();
    showToast(checked ? '기능이 켜졌습니다.' : '기능이 꺼졌습니다.');
  }

  function applyFeaturePreset(mode) {
    const val = (mode === 'all');
    Object.keys(state.features).forEach(k => { state.features[k] = val; });
    saveLocalUserState();
    renderAll();
    showToast(val ? '✨ 전체 기능이 모두 켜졌습니다!' : '🍃 라이트 간편 모드로 전환되었습니다!');
  }

  function renderSettingsTab() {
    if (state.settingsSubPage === 'features') return renderSettingsFeaturesPage();
    if (state.settingsSubPage === 'combos') return renderSettingsCombos();
    if (state.settingsSubPage === 'themes') return renderSettingsThemes();
    if (state.settingsSubPage === 'icons') return renderSettingsIcons();
    if (state.settingsSubPage === 'fonts') return renderSettingsFonts();
    if (state.settingsSubPage === 'guide') return renderSettingsGuide();

    const curFont = FONTS.find(f => f.id === state.fontId) || FONTS[0];
    const curTheme = getCurrentEffectiveTheme();
    const isCustomEmoji = JSON.stringify(state.emojis) !== JSON.stringify(DEFAULT_EMOJIS);
    const f = state.features;
    const activeFeatureCount = Object.values(f).filter(Boolean).length;
    const totalFeatureCount = Object.keys(f).length;

    const menus = [
      { id: 'features', icon: '🎛️', title: '기능 설정', desc: '태그 · 멀티 프로필 · PIN 잠금 · 24시간 타임라인 ON/OFF', badge: `${activeFeatureCount}/${totalFeatureCount} 켜짐` },
      { id: 'themes', icon: '🎨', title: '색상 테마 설정', desc: '라이트/다크 고유 스와치 미리보기 · 내 테마 만들기', badge: curTheme.name },
      { id: 'combos', icon: '🧩', title: '내 조합 관리', desc: '색상 테마 + 이모지 묶음 저장 · 불러오기 · 수정', badge: `조합 ${(state.customCombos || []).length}개` },
