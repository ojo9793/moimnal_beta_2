      { id: 'fonts', icon: '🔤', title: '폰트(글꼴) 설정', desc: '무료 한글 웹폰트 6종 선택 및 실시간 미리보기', badge: curFont.name.split(' ')[0] },
      { id: 'guide', icon: '📖', title: '사용법 가이드 · 초기화', desc: '1분 빠른 시작 · 기능별 상세 가이드 · 백업/초기화', badge: '가이드 · 백업' }
    ];

    return `
      <div class="card" style="background:linear-gradient(135deg, var(--accent-soft), var(--surface));">
        <div class="card-header" style="margin-bottom:6px;">
          <div class="card-title">☁️ 구글 계정 연동 및 기기 동기화</div>
          <span class="badge ${currentAuthUser ? 'badge-ok' : ''}">${currentAuthUser ? '연동 완료' : '게스트 모드'}</span>
        </div>
        ${currentAuthUser ? `
          <div class="small fw-700 mb-4">${escapeHtml(currentAuthUser.displayName || '구글 사용자')} (${escapeHtml(currentAuthUser.email || '')})</div>
          <div class="xs muted mb-10">이 계정으로 로그인한 모든 기기에서 프로필·주간 시간표·고정 일정·테마가 실시간으로 동기화됩니다.</div>
          <button class="btn btn-ghost btn-xs" onclick="unlinkGoogleAccount()">연동 해제 (로그아웃)</button>
        ` : `
          <div class="xs muted mb-10" style="line-height:1.5;">
            로그인 없이도 모든 모임 기능을 바로 쓸 수 있습니다. 구글 계정을 연결하면 다른 스마트폰·PC에서도 내 시간표와 프로필을 그대로 이어 쓸 수 있어요.
          </div>
          <button class="btn btn-primary btn-sm" style="width:100%;" onclick="startGoogleAccountLink()">🔗 구글 계정으로 데이터 연동하기</button>
        `}
      </div>

      <div class="card">
        <div class="card-title mb-6">📅 달력 · 시간표 시작 요일</div>
        <div class="xs muted mb-8">고정 일정 달력, 모임 방 조율 달력, 일주일 시간표의 첫 번째 요일을 선택합니다.</div>
        <div class="seg-tabs" style="margin-bottom:0;">
          <button class="seg-tab ${state.weekStartDay === 'sun' ? 'active' : ''}" onclick="setWeekStartDay('sun')">일요일 시작 (일~토)</button>
          <button class="seg-tab ${state.weekStartDay === 'mon' ? 'active' : ''}" onclick="setWeekStartDay('mon')">월요일 시작 (월~일)</button>
        </div>
      </div>

      <div class="section-label"><span>나만의 모임날 꾸미기 & 설정</span></div>
      ${menus.map(m => `
        <div class="settings-menu-card" onclick="setSettingsSubPage('${m.id}')">
          <div class="settings-menu-left">
            <div class="settings-menu-icon">${m.icon}</div>
            <div style="min-width:0;">
              <div class="fw-700" style="font-size:0.94rem;">${m.title}</div>
              <div class="xs muted mt-6">${m.desc}</div>
            </div>
          </div>
          <div style="display:flex;align-items:center;gap:5px;flex-shrink:0;">
            <span class="badge badge-accent">${escapeHtml(m.badge)}</span>
            <span class="muted">›</span>
          </div>
        </div>
      `).join('')}
    `;
  }

  function renderSettingsFeaturesPage() {
    const f = state.features;
    const toggleItems = [
      { key: 'tags', title: '🏷️ 프로필 · 모임 태그 표시', desc: '프로필과 모임 방에 태그 배지 및 태그별 필터를 표시합니다.' },
      { key: 'multiProfile', title: '🎭 멀티 프로필 · 전체 비공개 잠금', desc: '방별 프로필 전환과 전체 일정명 비공개 스위치를 사용합니다.' },
      { key: 'pinLock', title: '🔒 모임 방 PIN 잠금 보호', desc: '방 개설 시 4자리 PIN 비밀번호 잠금을 설정할 수 있습니다.' },
      { key: 'reminderFilter', title: '🔔 미입력 독촉 · 후보 필터', desc: '미입력 멤버 독촉 문구 복사와 전원 가능·주말 필터를 표시합니다.' },
      { key: 'fullDayTimeline', title: '🕒 24시간 전체 타임라인 표시', desc: '일주일 시간표를 08:00~24:00 대신 00:00~24:00 전체로 확장합니다.' },
      { key: 'advancedCustom', title: '🎨 고급 꾸미기 모드', desc: '개별 테마 지정, HEX 코드 입력 및 공유 코드 교환을 활성화합니다.' }
    ];

    return `
      <div class="card">
        <div class="card-header">
          <div class="card-title">🎛️ 부가 기능 켜기 · 끄기</div>
        </div>
        <div class="btn-grid-2 mb-10">
          <button class="btn btn-soft btn-xs" onclick="applyFeaturePreset('all')">✨ 전체 기능 켜기</button>
          <button class="btn btn-ghost btn-xs" onclick="applyFeaturePreset('lite')">🍃 라이트 간편 모드</button>
        </div>

        ${toggleItems.map(item => `
          <div class="feature-toggle-row">
            <div style="min-width:0;">
              <div class="small fw-700">${item.title}</div>
              <div class="xs muted mt-6">${item.desc}</div>
            </div>
            <label class="switch">
              <input type="checkbox" ${f[item.key] ? 'checked' : ''} onchange="toggleFeatureFlag('${item.key}', this.checked)">
              <span class="slider"></span>
            </label>
          </div>
        `).join('')}
      </div>
    `;
  }

  function renderStaticThemeSwatchButton(theme, isSelected, onClickExpr) {
    const isDarkTheme = getLuminance(theme.bg) < 0.35;
    const fixedBg = theme.bg;
    const fixedText = isDarkTheme ? '#F8FAFC' : '#111827';
    const subDot = theme.sub || (isDarkTheme ? adjustHex(theme.bg, 28) : adjustHex(theme.bg, -14));
    const dotRing = isDarkTheme ? '1px solid rgba(255,255,255,0.34)' : '1px solid rgba(15,23,42,0.18)';
    const accentLum = getLuminance(theme.accent);
    const pillText = accentLum > 0.55 ? '#111827' : '#FFFFFF';

    const borderCss = isSelected
      ? `2.5px solid ${theme.accent}`
      : (isDarkTheme ? '1.5px solid rgba(255,255,255,0.24)' : '1.5px solid rgba(15,23,42,0.14)');

    const shadowCss = isSelected
      ? `0 0 0 3px ${hexToRgba(theme.accent, 0.28)}, 0 4px 12px rgba(0,0,0,0.12)`
      : '0 2px 6px rgba(0,0,0,0.05)';

    return `
      <button type="button"
        class="static-swatch-btn"
        style="background:${fixedBg};color:${fixedText};border:${borderCss};box-shadow:${shadowCss};"
        onclick="${onClickExpr}">
        <div class="swatch-top-row">
          <span class="swatch-name" style="color:${fixedText};">${escapeHtml(theme.name)}</span>
        </div>
        <div class="swatch-bottom-row">
          <span class="swatch-dots-3">
            <span class="swatch-dot-item" style="background:${fixedBg};border:${dotRing};"></span>
            <span class="swatch-dot-item" style="background:${subDot};border:${dotRing};"></span>
            <span class="swatch-dot-item" style="background:${theme.accent};border:${dotRing};"></span>
          </span>
          ${isSelected
            ? `<span class="swatch-active-pill" style="background:${theme.accent};color:${pillText};">✓ 적용 중</span>`
            : `<span style="font-size:0.68rem;font-weight:700;opacity:0.72;color:${fixedText};">${isDarkTheme ? '다크' : '라이트'}</span>`}
        </div>
      </button>
    `;
  }

  function renderSettingsThemes() {
    const allThemes = getAllThemes();
    const adv = state.features.advancedCustom;

    return `
      ${adv ? `
        <div class="card">
          <div class="card-title mb-8">테마 적용 방식 선택</div>
          <div class="seg-tabs" style="margin-bottom:0;">
            <button class="seg-tab ${state.themeMode === 'global' ? 'active' : ''}" onclick="setThemeMode('global')">전체 화면 공통</button>
            <button class="seg-tab ${state.themeMode === 'per_target' ? 'active' : ''}" onclick="setThemeMode('per_target')">탭 · 모임별 개별 지정</button>
          </div>
        </div>
      ` : ''}

      ${(!adv || state.themeMode === 'global') ? `
        <div class="section-label"><span>기본 · 커스텀 테마 선택</span></div>
        <div class="theme-grid mb-10">
          ${allThemes.map(t => renderStaticThemeSwatchButton(
            t,
            state.globalThemeId === t.id,
            `selectGlobalTheme('${t.id}')`
          )).join('')}
        </div>
      ` : `
        <div class="card">
          <div class="card-title mb-8">하단 5개 탭별 개별 테마</div>
          ${[
            { key: 'home', label: `${state.emojis.nav_home} 홈` },
            { key: 'regular', label: `${state.emojis.nav_regular} 상시 모임` },
            { key: 'short', label: `${state.emojis.nav_short} 단기 모임` },
            { key: 'profile', label: `${state.emojis.nav_profile} 내 프로필` },
            { key: 'settings', label: `${state.emojis.nav_settings} 꾸미기·설정` }
          ].map(tab => `
            <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;">
              <span class="small fw-700">${tab.label}</span>
              <select class="select" style="width:58%;padding:6px 8px;" onchange="setTabTheme('${tab.key}', this.value)">
                ${allThemes.map(t => `<option value="${t.id}" ${state.tabThemes[tab.key] === t.id ? 'selected' : ''}>${escapeHtml(t.name)}</option>`).join('')}
              </select>
            </div>
          `).join('')}

          <div class="card-title mt-10 mb-8" style="padding-top:8px;border-top:1px dashed var(--border);">모임 방별 개별 테마</div>
          ${state.rooms.map(r => `
            <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;">
              <span class="small fw-700" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${escapeHtml(r.name)}</span>
              <select class="select" style="width:55%;padding:6px 8px;" onchange="setRoomTheme('${r.id}', this.value)">
                ${allThemes.map(t => `<option value="${t.id}" ${(state.roomThemes[r.id] || state.globalThemeId) === t.id ? 'selected' : ''}>${escapeHtml(t.name)}</option>`).join('')}
              </select>
            </div>
          `).join('')}
        </div>
      `}

      ${adv ? `
        <div class="card">
          <div class="card-header">
            <div class="card-title">🎨 내 색상 테마 만들기 (HEX 지원)</div>
            <button class="btn btn-outline btn-xs" onclick="openImportCodeModal('theme')">📥 코드 불러오기</button>
          </div>
          <div class="xs muted mb-10">바탕색과 진한색(포인트)을 팔레트 또는 색상 코드(#HEX)로 입력해 나만의 테마를 저장하세요.</div>

          <input class="input mb-8" id="customThemeName" placeholder="테마 이름 (예: 딸기우유 핑크)" />

          <div class="mb-8">
            <div class="xs fw-700 mb-4">1. 바탕색 (Background)</div>
            <div class="hex-picker-row">
              <input type="color" class="color-native" id="customBgPicker" value="#FFF0F6" oninput="syncHexFromPicker('customBgPicker', 'customBgHex')" />
              <input type="text" class="input hex-input" id="customBgHex" value="#FFF0F6" maxlength="7" placeholder="#FFF0F6" oninput="syncPickerFromHex('customBgHex', 'customBgPicker')" />
            </div>
          </div>

          <div class="mb-10">
            <div class="xs fw-700 mb-4">2. 진한색 (Accent / 강조색)</div>
            <div class="hex-picker-row">
              <input type="color" class="color-native" id="customAccentPicker" value="#D6336C" oninput="syncHexFromPicker('customAccentPicker', 'customAccentHex')" />
              <input type="text" class="input hex-input" id="customAccentHex" value="#D6336C" maxlength="7" placeholder="#D6336C" oninput="syncPickerFromHex('customAccentHex', 'customAccentPicker')" />
            </div>
          </div>

          <button class="btn btn-primary btn-sm" style="width:100%;" onclick="createCustomTheme()">+ 내 색상 테마 저장 및 적용</button>
        </div>

        ${(state.customThemes || []).length > 0 ? `
          <div class="section-label"><span>내가 만든 테마 관리 (${state.customThemes.length})</span></div>
          ${state.customThemes.map(ct => `
            <div class="card" style="padding:10px 12px;">
              <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;">
                <div class="fw-700 small">${escapeHtml(ct.name)}</div>
                <span class="xs muted">${ct.bg} / ${ct.accent}</span>
              </div>
              <div class="btn-row">
                <button class="btn btn-primary btn-xs" onclick="selectGlobalTheme('${ct.id}')">적용</button>
                <button class="btn btn-ghost btn-xs" onclick="openEditCustomThemeModal('${ct.id}')">✏️ 수정</button>
                <button class="btn btn-outline btn-xs" onclick="copyShareCode('theme', '${ct.id}')">📤 코드 복사</button>
                <button class="btn btn-danger btn-xs" onclick="deleteCustomTheme('${ct.id}')">삭제</button>
              </div>
            </div>
          `).join('')}
        ` : ''}
      ` : ''}
    `;
  }

  function syncHexFromPicker(pickerId, hexId) {
    const picker = document.getElementById(pickerId);
    const hexInput = document.getElementById(hexId);
    if (picker && hexInput) {
      hexInput.value = picker.value.toUpperCase();
      hexInput.classList.remove('invalid');
    }
  }

  function syncPickerFromHex(hexId, pickerId) {
    const hexInput = document.getElementById(hexId);
    const picker = document.getElementById(pickerId);
    if (!hexInput || !picker) return;
    const norm = normalizeHex(hexInput.value);
    if (norm) {
      picker.value = norm;
      hexInput.classList.remove('invalid');
    } else {
      hexInput.classList.add('invalid');
    }
  }

  function createCustomTheme() {
    const nameEl = document.getElementById('customThemeName');
    const bgEl = document.getElementById('customBgHex');
    const acEl = document.getElementById('customAccentHex');
    const bg = normalizeHex(bgEl && bgEl.value);
    const accent = normalizeHex(acEl && acEl.value);

    if (!bg || !accent) {
      showToast('올바른 HEX 색상 코드(예: #FFF0F6)를 입력해 주세요!');
      return;
    }
    const name = (nameEl && nameEl.value.trim()) || `커스텀 테마 ${(state.customThemes || []).length + 1}`;
    const id = 'ct_' + Date.now();
    const isDark = getLuminance(bg) < 0.35;
    const sub = isDark ? adjustHex(bg, 26) : adjustHex(bg, -14);
    state.customThemes.push({ id, name, bg, sub, accent, builtin: false });
    state.themeMode = 'global';
    state.globalThemeId = id;
    saveLocalUserState();
    renderAll();
    showToast(`🎨 '${name}' 테마가 저장 및 적용되었습니다!`);
  }

  function deleteCustomTheme(id) {
    state.customThemes = (state.customThemes || []).filter(t => t.id !== id);
    if (state.globalThemeId === id) state.globalThemeId = 'modern_light';
    saveLocalUserState();
    renderAll();
    showToast('커스텀 테마가 삭제되었습니다.');
  }

  function setThemeMode(mode) {
    state.themeMode = mode;
    saveLocalUserState();
    renderAll();
  }

  function selectGlobalTheme(id) {
    state.themeMode = 'global';
    state.globalThemeId = id;
    saveLocalUserState();
    renderAll();
    const t = getAllThemes().find(x => x.id === id);
    showToast(`🎨 '${t ? t.name : '테마'}'가 적용되었습니다!`);
  }

  function setTabTheme(tabKey, themeId) {
    state.tabThemes[tabKey] = themeId;
    saveLocalUserState();
    renderAll();
  }

  function setRoomTheme(roomId, themeId) {
    state.roomThemes[roomId] = themeId;
    saveLocalUserState();
    renderAll();
  }

  function renderSettingsCombos() {
    const adv = state.features.advancedCustom;
    return `
      <div class="card">
        <div class="card-title mb-6">➕ 현재 설정을 새 조합으로 저장</div>
        <div class="xs muted mb-10">현재 설정된 색상 테마와 하단·일정 이모지 9종을 하나의 조합으로 묶어 저장합니다.</div>
        <div class="btn-row">
          <input class="input" id="newComboNameInput" placeholder="조합 이름 (예: 시험기간 다크 조합)" style="flex:1;min-width:160px;" />
          <button class="btn btn-primary btn-sm" onclick="saveCurrentAsNewCombo()">저장하기</button>
        </div>
        ${adv ? `
          <div class="mt-10" style="padding-top:8px;border-top:1px dashed var(--border);">
            <button class="btn btn-outline btn-sm" style="width:100%;" onclick="openImportCodeModal('combo')">📥 친구의 조합 공유 코드 불러오기</button>
          </div>
        ` : ''}
      </div>

      <div class="section-label"><span>저장된 내 조합 (${(state.customCombos || []).length})</span></div>
      ${(state.customCombos || []).map(cb => `
        <div class="card">
          <div class="card-header">
            <div class="card-title">🧩 ${escapeHtml(cb.name)}</div>
            <span class="badge">${cb.themeMode === 'global' ? '전체 공통' : '개별 테마'}</span>
          </div>
          <div class="xs muted mb-10">
            포함 이모지: ${cb.emojis.nav_home} ${cb.emojis.nav_regular} ${cb.emojis.nav_short} ${cb.emojis.nav_profile} ${cb.emojis.nav_settings} · ${cb.emojis.sch_time} ${cb.emojis.sch_place} ${cb.emojis.sch_memo} ${cb.emojis.sch_pin}
          </div>
          <div class="btn-row">
            <button class="btn btn-primary btn-sm" onclick="applyCombo('${cb.id}')">불러오기</button>
            <button class="btn btn-soft btn-sm" onclick="overwriteComboWithCurrent('${cb.id}')">🔄 현재 설정 덮어쓰기</button>
            <button class="btn btn-ghost btn-sm" onclick="openRenameComboModal('${cb.id}')">✏️ 이름</button>
            ${adv ? `<button class="btn btn-outline btn-sm" onclick="copyShareCode('combo', '${cb.id}')">📤 코드 복사</button>` : ''}
            <button class="btn btn-danger btn-sm" onclick="deleteCombo('${cb.id}')">삭제</button>
          </div>
        </div>
      `).join('')}
    `;
  }

  function saveCurrentAsNewCombo() {
    const input = document.getElementById('newComboNameInput');
    const name = (input && input.value.trim()) || `내 조합 ${(state.customCombos || []).length + 1}`;
    state.customCombos.push({
      id: 'cb_' + Date.now(),
      name,
      themeMode: state.themeMode,
      globalThemeId: state.globalThemeId,
      tabThemes: { ...state.tabThemes },
      roomThemes: { ...state.roomThemes },
      emojis: { ...state.emojis }
    });
    saveLocalUserState();
    renderAll();
    showToast(`'${name}' 조합이 저장되었습니다!`);
  }

  function applyCombo(comboId) {
    const cb = (state.customCombos || []).find(c => c.id === comboId);
    if (!cb) return;
    state.themeMode = cb.themeMode || 'global';
    state.globalThemeId = cb.globalThemeId || 'modern_light';
    state.tabThemes = { ...state.tabThemes, ...(cb.tabThemes || {}) };
    state.roomThemes = { ...state.roomThemes, ...(cb.roomThemes || {}) };
    state.emojis = { ...DEFAULT_EMOJIS, ...(cb.emojis || {}) };
    saveLocalUserState();
    renderAll();
    showToast(`🧩 '${cb.name}' 조합을 불러왔습니다!`);

  function buildIcsContent(events) {
    const lines = [
      'BEGIN:VCALENDAR',
      'VERSION:2.0',
      'PRODID:-//Moimnal Beta2//KO',
      'CALSCALE:GREGORIAN'
    ];
    events.forEach((ev, idx) => {
      const dt = ev.date.replace(/-/g, '');
      lines.push('BEGIN:VEVENT');
      lines.push(`UID:moimnal-b2-${dt}-${idx}@moimnal.app`);
      lines.push(`DTSTART;VALUE=DATE:${dt}`);
      lines.push(`DTEND;VALUE=DATE:${dt}`);
      lines.push(`SUMMARY:${ev.title}`);
      lines.push(`LOCATION:${ev.place || ''}`);
      lines.push(`DESCRIPTION:${ev.memo || ''}`);
      lines.push('END:VEVENT');
    });
    lines.push('END:VCALENDAR');
    return lines.join('\r\n');
  }

  function triggerDownloadTextFile(filename, content) {
    try {
      const blob = new Blob([content], { type: 'text/calendar;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      showToast(`📅 ${filename} 파일이 저장되었습니다!`);
    } catch (e) {
      copyText(content, '📅 캘린더(.ics) 내용이 클립보드에 복사되었습니다!');
    }
  }

  function downloadSinglePinIcs(roomId, idx) {
    const room = state.rooms.find(r => r.id === roomId);
    const pin = room && room.pinnedDates[idx];
    if (!pin) return;
    const ics = buildIcsContent([{
      date: pin.date,
      title: room.name,
      place: pin.place,
      memo: `${pin.time || ''} ${pin.memo || ''}`.trim()
    }]);
    triggerDownloadTextFile(`moimnal_${pin.date}.ics`, ics);
  }

  function downloadAllConfirmedIcs() {
    const list = [];
    state.rooms.filter(r => !isShortTermRoomArchived(r)).forEach(r => {
      (r.pinnedDates || []).forEach(p => {
        list.push({ date: p.date, title: r.name, place: p.place, memo: `${p.time || ''} ${p.memo || ''}`.trim() });
      });
    });
    if (list.length === 0) return;
    triggerDownloadTextFile('moimnal_confirmed_all.ics', buildIcsContent(list));
  }

        </div>
      ` : '<div style="height:10px;"></div>'}

      <div class="btn-grid-2 mt-6">
        ${tutorialStep > 0
          ? `<button class="btn btn-ghost btn-sm" onclick="prevTutorialStep()">← 이전</button>`
          : `<button class="btn btn-ghost btn-sm" onclick="finishTutorial()">건너뛰기</button>`}
        ${tutorialStep < slides.length - 1
          ? `<button class="btn btn-primary btn-sm" onclick="nextTutorialStep()">다음 →</button>`
          : `<button class="btn btn-primary btn-sm" onclick="finishTutorial()">모임날 시작하기 🚀</button>`}
      </div>
    `, true);

  function prevTutorialStep() { tutorialStep--; renderTutorialStep(); }
  function finishTutorial() {
    state.tutorialDone = true;
    saveLocalUserState();
    closeModal();
  }

  function renderTagChips(tags, inputId, currentVal = '') {
    if (!tags || tags.length === 0) return '';
    const trimmed = (currentVal || '').trim().replace(/^#/, '');
    return `
      <div class="emoji-chips" id="${inputId}_chips" style="margin-top:6px;">
        ${tags.map(tag => `
          <button type="button"
            class="emoji-chip ${trimmed === tag ? 'active' : ''}"
            style="font-size:0.75rem;padding:4px 9px;font-weight:600;"
            data-tag="${escapeHtml(tag)}"
            onclick="applyTagChip('${inputId}', this.getAttribute('data-tag'))">
            #${escapeHtml(tag)}
          </button>
        `).join('')}
      </div>
    `;
  }

  function applyTagChip(inputId, tagValue) {
    const input = document.getElementById(inputId);
    if (!input) return;
    input.value = tagValue;
    syncTagChips(inputId);
  }

  function syncTagChips(inputId) {
    const input = document.getElementById(inputId);
    const wrap = document.getElementById(`${inputId}_chips`);
    if (!input || !wrap) return;
    const val = (input.value || '').trim().replace(/^#/, '');
    wrap.querySelectorAll('.emoji-chip').forEach(btn => {
      const btnTag = (btn.getAttribute('data-tag') || '').trim();
      btn.classList.toggle('active', val !== '' && btnTag === val);
    });
  }

    if (btnRegular) btnRegular.className = `btn btn-sm ${typeVal === 'regular' ? 'btn-primary' : 'btn-ghost'}`;
  }

      return;
    }
    const type = modalNewRoomType || 'short';
    const tagEl = document.getElementById('newRoomTag');

      if (profEl) {

      if (privEl) prof.privacyMode = privEl.checked;

  /* =========================================================
     테마 · 조합 공유 코드 인코딩 / 디코딩
     ========================================================= */
  function encodeSharePayload(prefix, obj) {
    const json = JSON.stringify(obj);
    const b64 = btoa(unescape(encodeURIComponent(json)));
    return `${prefix}:${b64}`;
  }

  function decodeSharePayload(codeStr, expectedPrefix) {
    const clean = (codeStr || '').trim();
    if (!clean.startsWith(expectedPrefix + ':')) return null;
    const b64 = clean.slice(expectedPrefix.length + 1);
    const json = decodeURIComponent(escape(atob(b64)));
    return JSON.parse(json);
  }

  function copyShareCode(kind, id) {
    if (kind === 'theme') {
      const ct = (state.customThemes || []).find(t => t.id === id);
      if (!ct) return;
      const code = encodeSharePayload('MOIM-THEME', { name: ct.name, bg: ct.bg, sub: ct.sub, accent: ct.accent });
      copyText(code, `📤 '${ct.name}' 테마 코드가 복사되었습니다!`);
    } else if (kind === 'combo') {
      const cb = (state.customCombos || []).find(c => c.id === id);
      if (!cb) return;
      const customThemeRef = (state.customThemes || []).find(t => t.id === cb.globalThemeId) || null;
      const code = encodeSharePayload('MOIM-COMBO', {
        name: cb.name,
        themeMode: cb.themeMode,
        globalThemeId: cb.globalThemeId,
        tabThemes: cb.tabThemes,
        emojis: cb.emojis,
        customThemeRef
      });
      copyText(code, `📤 '${cb.name}' 조합 공유 코드가 복사되었습니다!`);
    }
  }

  function openImportCodeModal(kind) {
    const label = kind === 'theme' ? '색상 테마 (MOIM-THEME:...)' : '내 조합 (MOIM-COMBO:...)';
    openModal(`
      <div class="card-header">

        <button class="btn btn-ghost btn-xs" onclick="closeModal()">닫기</button>

      <div class="xs muted mb-8">친구에게 전달받은 공유 코드를 아래 칸에 붙여넣어 주세요.</div>
      <textarea class="textarea mb-10" id="importCodeTextarea" placeholder="${kind === 'theme' ? 'MOIM-THEME:...' : 'MOIM-COMBO:...'}"></textarea>
      <button class="btn btn-primary" style="width:100%;" onclick="confirmImportCode('${kind}')">불러오기 및 즉시 적용</button>
    `);
  }

  function confirmImportCode(kind) {
    const raw = document.getElementById('importCodeTextarea').value;
    try {
      if (kind === 'theme') {
        const data = decodeSharePayload(raw, 'MOIM-THEME');
        if (!data || !data.bg || !data.accent) throw new Error('invalid');
        const id = 'ct_' + Date.now();
        const isDark = getLuminance(data.bg) < 0.35;
        const sub = data.sub || (isDark ? adjustHex(data.bg, 26) : adjustHex(data.bg, -14));
        state.customThemes.push({ id, name: data.name || '공유받은 테마', bg: data.bg, sub, accent: data.accent, builtin: false });
        state.themeMode = 'global';
        state.globalThemeId = id;
        saveLocalUserState();
        closeModal();
        renderAll();
        showToast(`🎨 '${data.name}' 테마를 불러와 적용했습니다!`);
      } else {
        const data = decodeSharePayload(raw, 'MOIM-COMBO');
        if (!data || !data.emojis) throw new Error('invalid');
        let themeId = data.globalThemeId || 'modern_light';
        if (data.customThemeRef && data.customThemeRef.bg) {
          const newTid = 'ct_' + Date.now();
          state.customThemes.push({
            id: newTid,
            name: data.customThemeRef.name || '공유 테마',
            bg: data.customThemeRef.bg,
            sub: data.customThemeRef.sub || data.customThemeRef.bg,
            accent: data.customThemeRef.accent,
            builtin: false
          });
          themeId = newTid;
        }
        const comboId = 'cb_' + Date.now();
        state.customCombos.push({
          id: comboId,
          name: data.name || '공유받은 조합',
          themeMode: data.themeMode || 'global',
          globalThemeId: themeId,
          tabThemes: { ...state.tabThemes, ...(data.tabThemes || {}) },
          roomThemes: { ...state.roomThemes },
          emojis: { ...DEFAULT_EMOJIS, ...data.emojis }
        });
        applyCombo(comboId);
        closeModal();
      }
    } catch (e) {
      showToast('올바른 공유 코드 형식이 아닙니다. 코드를 다시 확인해 주세요.');
    }
  }

  /* =========================================================
     유틸리티 & 메인 렌더러 & 초대 링크(?room=ID) 진입 처리
     ========================================================= */
  function escapeHtml(str) {
    return String(str || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  function formatKoreanDate(iso) {
    if (!iso) return '';
    const parts = iso.split('-');
    if (parts.length !== 3) return iso;
    const d = new Date(iso + 'T00:00:00');
    const dow = DOW_LABELS[d.getDay()] || '';
    return `${parseInt(parts[1], 10)}월 ${parseInt(parts[2], 10)}일(${dow})`;
  }

  function renderMainContent() {
    const scroll = document.getElementById('appScroll');
    if (!scroll) return;

    if (state.selectedRoomId) {
      scroll.innerHTML = renderRoomDetail();

    if (state.activeTab === 'home') scroll.innerHTML = renderHomeTab();
    else if (state.activeTab === 'regular') scroll.innerHTML = renderRoomListTab('regular');
    else if (state.activeTab === 'short') scroll.innerHTML = renderRoomListTab('short');
    else if (state.activeTab === 'profile') scroll.innerHTML = renderProfileTab();
    else if (state.activeTab === 'settings') scroll.innerHTML = renderSettingsTab();
  }

  async function initApp() {
    syncMobileViewportHeight();
    renderAll();

    let invitedRoomId = null;
    try {
      const params = new URLSearchParams(window.location.search);
      invitedRoomId = params.get('room');
    } catch (e) {}

    let invitedRoomObj = null;
    if (invitedRoomId && db) {
      try {
        const snap = await getDoc(doc(db, ROOMS_COLLECTION, invitedRoomId));
        if (snap.exists()) {
          invitedRoomObj = normalizeRoomDoc({ id: snap.id, ...snap.data() });
          const idx = state.rooms.findIndex(r => r.id === invitedRoomId);
          if (idx >= 0) state.rooms[idx] = invitedRoomObj;
          else state.rooms.unshift(invitedRoomObj);
          saveLocalUserState(true);
          renderAll();
        }
      } catch (e) {
        console.warn('Direct room fetch error:', e);
      }
    }

    startCloudRoomsSubscription();

    if (!state.profileSetupDone) {
      openFirstVisitNicknameModal(invitedRoomObj ? invitedRoomObj.id : null);
      return;
    }

    if (invitedRoomObj) {
      if (state.roomProfileMap && state.roomProfileMap[invitedRoomObj.id]) {
        enterRoom(invitedRoomObj.id, 'calendar');
      } else if (state.features.multiProfile) {
        openInviteRoomProfileChoiceModal(invitedRoomObj);
      } else {
        enterRoom(invitedRoomObj.id, 'calendar');
      }
    }
  }
